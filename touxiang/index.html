<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>极简代码头像生成器 v2.0</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #e5e5e5; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); display: flex; gap: 30px; align-items: flex-start; }
        .controls { display: grid; gap: 15px; width: 300px; }
        .control-group { display: flex; flex-direction: column; }
        label { font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 500; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        input[type="color"] { height: 40px; padding: 2px; cursor: pointer; }
        canvas { border: 1px solid #eee; border-radius: 4px; background: white; width: 400px; height: 400px; }
        button { background: #000; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        .tip { font-size: 12px; color: #999; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <canvas id="avatarCanvas" width="800" height="800"></canvas>
            <div class="tip">预览图已自动同步（800x800 高清）</div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>文本内容</label>
                <input type="text" id="textInput" placeholder="输入你的冷幽默..." value="// searching for motivation... 0 matches">
            </div>
            <div class="control-group">
                <label>背景颜色</label>
                <input type="color" id="bgColor" value="#f2f2f2">
            </div>
            <div class="control-group">
                <label>文字颜色</label>
                <input type="color" id="textColor" value="#555555">
            </div>
            <button id="downloadBtn">下载图片</button>
        </div>
    </div>

<script>
    // 确保 DOM 加载完后再执行
    window.onload = function() {
        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d');
        const textInput = document.getElementById('textInput');
        const bgColor = document.getElementById('bgColor');
        const textColor = document.getElementById('textColor');
        const downloadBtn = document.getElementById('downloadBtn');

        function draw() {
            const size = canvas.width;
            
            // 1. 填充背景
            ctx.fillStyle = bgColor.value;
            ctx.fillRect(0, 0, size, size);

            // 2. 绘制文本
            ctx.fillStyle = textColor.value;
            // 字体选择：等宽且稍微厚实一点，置底时更有分量感
            ctx.font = "36px 'Consolas', 'Monaco', 'Courier New', monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "alphabetic";
            
            // 核心排版：置底（距离底部 12% 的高度）
            const x = size / 2;
            const y = size * 0.88;
            
            ctx.fillText(textInput.value, x, y);
        }

        // 下载功能
        downloadBtn.onclick = function() {
            const link = document.createElement('a');
            link.download = 'code-style-avatar.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        // 实时重绘
        [textInput, bgColor, textColor].forEach(el => {
            el.addEventListener('input', draw);
        });

        // 初始调用一次
        draw();
    };
</script>
</body>
</html>
