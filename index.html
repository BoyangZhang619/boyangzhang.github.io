<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝑻𝑯𝑬 𝑯𝑶𝑴𝑬</title>
</head>

<body>
    <button id="btn">点我请求后端</button>
    <pre id="out1"></pre>
    <pre id="out2"></pre>
</body>
<script>
    const btn = document.getElementById("btn");
    const out1 = document.getElementById("out1");
    const out2 = document.getElementById("out2");

    btn.onclick = async () => {
        out1.textContent = "请求中...";

        try {
            const res = await fetch("/api/ping"); // 重点：同域请求
            if (!res.ok) throw new Error("HTTP " + res.status);

            const data = await res.json();
            out1.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
            out1.textContent = "失败：" + e.message;
        }
        const send = {
            message: "Hello, backend!",
            timestamp: Date.now()
        };
        try {
            const next_res = await fetch("/api/echo", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(send)
            });
            console.log(next_res);
            if (!next_res.ok) throw new Error("HTTP " + next_res.status);

            const next_data = await next_res.json();
            out2.textContent = JSON.stringify(next_data, null, 4);
        } catch (e) {
            out2.textContent = "失败：" + e.message;
        }
    };
</script>

</html>
